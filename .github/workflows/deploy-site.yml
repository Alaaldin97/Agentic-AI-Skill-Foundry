name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'web/**'
      - 'scripts/build_index.py'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build catalog and deploy
    environment:
      name: production
      url: https://jhf-skills.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the catalog from skills/
        run: python scripts/build_index.py

      - name: Package the site
        run: cd web && zip -r ../site.zip . -x '*.git*'

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: jhf-skills
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site.zip

      - name: Confirm it is serving
        run: |
          sleep 25
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://jhf-skills.azurewebsites.net/skills.json || true)
            if [ "$CODE" = "200" ]; then
              echo "::notice::Live at https://jhf-skills.azurewebsites.net (skills.json $CODE)"
              exit 0
            fi
            echo "attempt $i: got $CODE, retrying"
            sleep 15
          done
          echo "::error::Site did not return 200 after deploy"
          exit 1
